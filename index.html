<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حِرفة | منصة الخدمات</title>
  <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-slate-50 text-right font-sans antialiased">

  <div class="max-w-md mx-auto p-4 min-h-screen">
    
    <header class="bg-gradient-to-r from-slate-900 to-slate-800 text-white p-8 rounded-3xl text-center mb-8 shadow-2xl border border-slate-700">
      <h1 class="text-3xl font-black tracking-tighter uppercase text-white">حِرفة</h1>
      <p class="text-amber-500 text-xs font-bold tracking-widest mt-2">منصة الخدمات التقنية</p>
    </header>

    <div class="grid grid-cols-3 gap-3 mb-8">
      <button id="btn-customer" class="py-3 px-2 rounded-2xl text-xs font-bold bg-emerald-500 text-white shadow-lg shadow-emerald-500/30 transition-all">تصفح</button>
      <button id="btn-craftsman" class="py-3 px-2 rounded-2xl text-xs font-bold bg-white text-slate-900 border border-slate-200 transition-all">تسجيل</button>
      <button id="btn-admin" class="py-3 px-2 rounded-2xl text-xs font-bold bg-white text-slate-900 border border-slate-200 transition-all">الإدارة</button>
    </div>

    <div id="loading" class="text-center font-bold p-10 text-slate-400">جاري الاتصال...</div>

    <main id="view-customer" class="space-y-6">
      <h2 class="font-bold text-md text-slate-800">الفنيون المتاحون</h2>
      <div id="craftsmen-list" class="space-y-4"></div>
    </main>

    <section id="view-craftsman" class="hidden bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
      <h2 class="font-bold text-lg text-slate-900 mb-6">تسجيل حرفي جديد</h2>
      <form id="form-register-craftsman" class="space-y-4">
        <input id="reg-name" type="text" placeholder="الاسم الكامل" required class="w-full border border-slate-200 p-4 rounded-xl text-xs">
        <input id="reg-phone" type="tel" placeholder="رقم الهاتف" required class="w-full border border-slate-200 p-4 rounded-xl text-xs">
        <input id="reg-job" type="text" placeholder="التخصص" required class="w-full border border-slate-200 p-4 rounded-xl text-xs">
        <input id="reg-city" type="text" placeholder="المدينة" required class="w-full border border-slate-200 p-4 rounded-xl text-xs">
        <input id="reg-neighborhood" type="text" placeholder="الحي" required class="w-full border border-slate-200 p-4 rounded-xl text-xs">
        <button type="submit" class="w-full bg-emerald-500 text-white p-4 rounded-xl text-sm font-bold">حفظ البيانات</button>
      </form>
    </section>

    <section id="view-admin" class="hidden bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
      <h2 class="font-bold text-lg text-slate-900">لوحة الإدارة</h2>
    </section>
  </div>
